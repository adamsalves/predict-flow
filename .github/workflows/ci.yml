name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: predict
          POSTGRES_PASSWORD: predict
          POSTGRES_DB: predict_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predict -d predict_flow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Credenciais de demo local (ADR-0010); não são segredos.
      DATABASE_URL: postgresql+psycopg://predict:predict@localhost:5432/predict_flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-train.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt -r backend/requirements-train.txt
      - name: Ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: Verificar paridade de dependências treino/serving
        run: python scripts/check_dependency_parity.py
      - name: Verificar proteção de artefatos
        run: bash scripts/check_artifact_ignores.sh
      - name: pytest
        run: pytest -q
      - name: Smoke de treino (seleção LR/RF + gate)
        run: python -m training.train --version ci-smoke --output-dir /tmp/pf-models
