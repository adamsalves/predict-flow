name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: predict
          POSTGRES_PASSWORD: predict
          POSTGRES_DB: predict_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predict -d predict_flow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Credenciais de demo local (ADR-0010); não são segredos.
      DATABASE_URL: postgresql+psycopg://predict:predict@localhost:5432/predict_flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: backend
        run: pytest -q
