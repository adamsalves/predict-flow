# Ambiente local de demo (ADR-0010): não expor para dados reais nem à rede
# externa. Credenciais abaixo são defaults de desenvolvimento local apenas.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predict}
      POSTGRES_DB: ${POSTGRES_DB:-predict_flow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-predict} -d $${POSTGRES_DB:-predict_flow}"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-predict}:${POSTGRES_PASSWORD:-predict}@db:5432/${POSTGRES_DB:-predict_flow}
      MODEL_PATH: /models
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      CORS_ORIGINS: '["http://localhost:4200"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Modelos somente leitura (ADR-0003/ADR-0017): o staging em
      # ./ml-artifacts é o processo explícito que publica versões para o
      # serving; o backend nunca escreve no volume.
      - ./ml-artifacts:/models:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
